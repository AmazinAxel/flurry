[package]
name = "flurry"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "flurry"
path = "app.rs"

[dependencies]
libc = "0.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.8", default-features = false, features = ["wayland"] }
dbus = { version = "0.9", default-features = false }
pipewire = { version = "0.8", default-features = false }
zune-jpeg = { version = "0.4", default-features = false, features = ["std"] }
png = "0.17"

[build-dependencies]
usvg = { version = "0.45", default-features = false }

[profile.release]
lto = true
codegen-units = 1

strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
