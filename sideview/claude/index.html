<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<script src="marked.min.js"></script>
<style>
  @font-face { font-family: Libron; src: url(fonts/Libron-Regular.woff2); font-weight: 400; font-style: normal; }
  @font-face { font-family: Libron; src: url(fonts/Libron-Italic.woff2); font-weight: 400; font-style: italic; }
  @font-face { font-family: Libron; src: url(fonts/Libron-Bold.woff2); font-weight: 700; font-style: normal; }
  @font-face { font-family: Libron; src: url(fonts/Libron-BoldItalic.woff2); font-weight: 700; font-style: italic; }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2e3440; color: #eceff4; font: 15px/1.45 Libron, serif; }
  body { display: flex; flex-direction: column; }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 8px 0; }
  .msg { padding: 8px 14px; margin: 0 0 10px; overflow-wrap: anywhere; }
  .user { background: #3b4252; margin-right: 24px; white-space: pre-wrap; }
  .claude { background: #434c5e; margin-left: 24px; }
  .claude > :first-child { margin-top: 0; }
  .claude > :last-child { margin-bottom: 0; }
  .user img { display: block; max-width: 100%; max-height: 160px; margin: 0 0 6px; }
  p, ul, ol, pre, blockquote, table { margin: 0 0 8px; }
  ul, ol { padding-left: 22px; list-style: none; }
  /* markers are spans (see markers()): Servo numbers every <ol> item 0 */
  li { position: relative; }
  li > .marker { position: absolute; right: 100%; margin-right: 6px; white-space: nowrap; }
  .think { opacity: 0.5; font-style: italic; white-space: pre-wrap; }
  h1, h2, h3, h4 { margin: 10px 0 6px; font-size: 1.05em; }
  h1 { font-size: 1.2em; }
  a { color: #88c0d0; }
  code { font-family: "Iosevka Nerd Font Mono", monospace; font-size: 0.9em; background: #2e3440; padding: 1px 4px; }
  pre { background: #2e3440; padding: 8px; overflow-x: auto; }
  pre code { padding: 0; background: none; }
  blockquote { border-left: 3px solid #5e81ac; padding-left: 10px; color: #d8dee9; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid #4c566a; padding: 3px 7px; }
  hr { border: 0; border-top: 1px solid #4c566a; }
  .katex-display { overflow-x: auto; overflow-y: hidden; margin: 6px 0; }
  #input { flex: none; padding: 8px; }
  /* 7px + the line's half-leading (~3px) matches the 10px sides */
  #field { background: #3b4252; padding: 7px 10px; }
  #files { display: flex; flex-wrap: wrap; gap: 6px; padding: 3px 0 6px; }
  #files:empty { display: none; }
  #files img { display: block; max-height: 56px; }
  textarea { display: block; box-sizing: border-box; width: 100%; resize: none; border: 0; border-radius: 0; outline: 0;
    background: transparent; color: #eceff4; font: inherit; padding: 0; min-height: 1.45em; max-height: 40vh; }
</style>
<div id="log"></div>
<div id="input"><div id="field"><div id="files"></div><textarea id="box" rows="1" autofocus></textarea></div></div>
<script>
window.onerror = function (msg, src, line) { console.log("\u0001error: " + msg + " @" + line); };
(function () {
  var log = document.getElementById('log'), box = document.getElementById('box'), filesEl = document.getElementById('files');
  var files = [], reply = null, text = '', think = '', stopped = false, busy = false, queued = false;

  // $$..$$ / \[..\] blocks and $..$ / \(..\) inline, rendered by KaTeX; marked keeps code spans intact
  function tex(src, display) {
    try { return svgToImg(katex.renderToString(src, { displayMode: display, throwOnError: false, output: 'html' })); }
    catch (e) { return esc(src); }
  }
  // Servo paints SVG images but not inline <svg>, which KaTeX uses for radicals, wide accents and
  // stretchy arrows: turn each into an <img> of the same box, filled with the text color
  function svgToImg(html) {
    return html.replace(/<svg([^>]*)>([\s\S]*?)<\/svg>/g, function (_, attrs, body) {
      // a standalone SVG document needs its namespace
      var svg = '<svg xmlns="http://www.w3.org/2000/svg"' + attrs.replace(/style="[^"]*"/, '') + ' fill="#eceff4">' + body + '</svg>';
      // the box is katex.css's `.katex svg`; object-fit/position reproduce preserveAspectRatio,
      // which an image box would otherwise ignore (stretching the radical sign to nothing)
      var h = /height="([^"]*)"/.exec(attrs), par = (/preserveAspectRatio="([^"]*)"/.exec(attrs) || ['', 'xMidYMid'])[1];
      var fit = par === 'none' ? 'fill' : /slice/.test(par) ? 'cover' : 'contain';
      var x = /xMin/.test(par) ? 'left' : /xMax/.test(par) ? 'right' : 'center', y = /YMin/.test(par) ? 'top' : /YMax/.test(par) ? 'bottom' : 'center';
      var style = 'display:block;position:absolute;width:100%;height:' + (h ? h[1] : 'inherit') + ';object-fit:' + fit + ';object-position:' + x + ' ' + y + ';' + (/style="([^"]*)"/.exec(attrs) || ['', ''])[1];
      return '<img alt="" style="' + style + '" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '">';
    });
  }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  marked.use({
    gfm: true,
    breaks: false,
    renderer: { html: function (t) { return esc(typeof t === 'string' ? t : t.text); } },
    extensions: [
      { name: 'mathBlock', level: 'block',
        start: function (s) { var i = s.search(/\$\$|\\\[/); return i < 0 ? undefined : i; },
        tokenizer: function (s) {
          var m = /^\$\$([\s\S]+?)\$\$/.exec(s) || /^\\\[([\s\S]+?)\\\]/.exec(s);
          if (m) return { type: 'mathBlock', raw: m[0], text: m[1].trim() };
        },
        renderer: function (t) { return tex(t.text, true); } },
      { name: 'mathInline', level: 'inline',
        start: function (s) { var i = s.search(/\$|\\\(/); return i < 0 ? undefined : i; },
        tokenizer: function (s) {
          var m = /^\$\$([\s\S]+?)\$\$/.exec(s);
          if (m) return { type: 'mathInline', raw: m[0], text: m[1].trim(), display: true };
          m = /^\\\(([\s\S]+?)\\\)/.exec(s) || /^\$(?!\s)((?:\\.|[^\\$\n])+?)(?<!\s)\$(?!\d)/.exec(s);
          if (m) return { type: 'mathInline', raw: m[0], text: m[1], display: false };
        },
        renderer: function (t) { return tex(t.text, t.display); } }
    ]
  });

  // follow new output only while scrolled to the bottom: scrolling up detaches, back down reattaches
  var follow = true, lastTop = 0;
  function bottom() { log.scrollTop = log.scrollHeight; lastTop = log.scrollTop; follow = true; }
  log.addEventListener('scroll', function () {
    if (log.scrollTop < lastTop - 1) follow = false;
    else if (log.scrollHeight - log.scrollTop - log.clientHeight < 4) follow = true;
    lastTop = log.scrollTop;
  });
  function add(cls) { var d = document.createElement('div'); d.className = 'msg ' + cls; log.appendChild(d); return d; }

  function markers(root) {
    root.querySelectorAll('ul, ol').forEach(function (l) {
      var n = l.tagName === 'OL' ? parseInt(l.getAttribute('start') || '1', 10) : 0;
      Array.prototype.forEach.call(l.children, function (li) {
        var m = document.createElement('span'); m.className = 'marker';
        m.textContent = n ? (n++) + '.' : '•';
        li.insertBefore(m, li.firstChild);
      });
    });
  }

  // re-render the streaming reply at most once per frame
  function paint() {
    queued = false;
    if (!busy && !reply) return;
    // until the answer starts, the latest line of the thinking summary stands in for it
    var s = text ? '' : status();
    if (!text && !s) return; // no empty bubble before there is something to show
    if (!reply) reply = add('claude');
    if (text) { reply.innerHTML = marked.parse(text); markers(reply); }
    else { reply.innerHTML = ''; var t = document.createElement('div'); t.className = 'think'; t.textContent = s; reply.appendChild(t); }
    if (follow) bottom();
  }
  function schedule() { if (!queued) { queued = true; requestAnimationFrame(paint); } }

  function send() {
    var t = box.value.trim();
    if ((!t && !files.length) || busy) return;
    var content = files.map(function (f) { return { type: 'image', source: { type: 'base64', media_type: f.type, data: f.data } }; });
    if (t) content.push({ type: 'text', text: t });
    var u = add('user');
    files.forEach(function (f) { var i = document.createElement('img'); i.src = f.url; u.appendChild(i); });
    if (t) u.appendChild(document.createTextNode(t));
    box.value = ''; files = []; filesEl.innerHTML = ''; grow();
    reply = null; text = ''; think = ''; stopped = false; busy = true; bottom();
    console.log('\u0001claude:' + JSON.stringify({ type: 'user', message: { role: 'user', content: content } }));
  }

  function reset() {
    console.log('\u0001claude:new');
    log.innerHTML = ''; reply = null; text = ''; busy = false; files = []; filesEl.innerHTML = ''; box.value = ''; grow();
  }

  // last line of the thinking summary: "what Claude is doing now"
  function status() {
    var lines = think.split('\n').map(function (l) { return l.replace(/[*#_`]/g, '').trim(); }).filter(Boolean);
    return lines.length ? lines[lines.length - 1] : '';
  }

  // ends the reply; errors are always shown, after any partial answer (not for a Ctrl+C stop)
  function finish(err) {
    if (!busy) return;
    paint();
    busy = false;
    if (err && !stopped) {
      if (!reply) reply = add('claude');
      var e = document.createElement('p'); e.textContent = err; reply.appendChild(e); if (follow) bottom();
    }
    // a reply stopped during thinking keeps no thinking line
    if (reply && !text && !err) log.removeChild(reply);
    reply = null;
  }

  // stream-json events from `claude -p`
  window.__claude = function (ev) {
    if (!busy) return;
    var d = ev.type === 'stream_event' && ev.event.type === 'content_block_delta' ? ev.event.delta : null;
    if (d && d.type === 'text_delta') {
      text += d.text; schedule();
    } else if (d && d.type === 'thinking_delta') {
      think += d.thinking; if (!text) schedule();
    } else if (ev.type === 'result') {
      finish(ev.is_error ? String(ev.result || (ev.errors || []).join('; ') || ev.subtype || 'error') : '');
    } else if (ev.type === 'exit') {
      finish('');
    }
  };

  function grow() { box.style.height = 'auto'; box.style.height = box.scrollHeight + 'px'; }
  box.addEventListener('input', grow);
  // the panel opens before its final size: keep the box fully shown and the log pinned
  window.addEventListener('resize', function () { grow(); if (follow) bottom(); });
  // Libron arrives after the first layout and an empty box keeps the fallback font's metrics (shorter
  // box, smaller caret) until its text changes: touch the text once the font is in
  if (document.fonts) document.fonts.ready.then(function () { var v = box.value; box.value = v + ' '; box.value = v; grow(); });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); reset(); }
    // Esc drops the last attached image
    else if (e.key === 'Escape' && files.length) { e.preventDefault(); files.pop(); filesEl.removeChild(filesEl.lastChild); }
    // Ctrl+C stops the reply mid-stream (unless copying a selection); the conversation and partial answer stay
    else if (e.ctrlKey && (e.key === 'c' || e.key === 'C') && busy && box.selectionStart === box.selectionEnd && !String(window.getSelection())) {
      e.preventDefault();
      console.log('\u0001claude:' + JSON.stringify({ type: 'control_request', request_id: 'stop' + Date.now(), request: { subtype: 'interrupt' } }));
      stopped = true;
    }
    else if (document.activeElement !== box && !e.ctrlKey && !e.altKey) box.focus();
  });
  // Ctrl+V with an image on the clipboard: the helper hands over the bytes directly
  window.__flurryPaste = function (b64, type) {
    if (!/^image\/(png|jpeg|gif|webp)$/.test(type)) return;
    var url = 'data:' + type + ';base64,' + b64;
    files.push({ type: type, url: url, data: b64 });
    var img = document.createElement('img'); img.src = url; filesEl.appendChild(img);
  };
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (a) { e.preventDefault(); console.log('\u0001open:' + a.href); }
  });
  box.focus();
})();
</script>
