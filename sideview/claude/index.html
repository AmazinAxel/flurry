<!doctype html>
<meta charset="utf-8">
<!-- local resources only: nothing in a reply (e.g. a markdown image) can reach the network.
     file: rather than 'self': file pages have an opaque origin that 'self' never matches -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; img-src data:; font-src file:">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<script src="marked.min.js"></script>
<style>
  @font-face { font-family: Sora; src: url(fonts/Sora.woff2) format("woff2"); font-weight: 300 600; font-style: normal; }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2e3440; color: #eceff4; font: 300 16.5px/1.5 Sora, sans-serif; }
  body { display: flex; flex-direction: column; }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px 0; }
  .msg { padding: 12px 16px; margin: 0 0 14px; overflow-wrap: anywhere; }
  .user { background: #3b4252; margin-right: 24px; white-space: pre-wrap; }
  .claude { background: #434c5e; margin-left: 12px; line-height: 1.65; }
  .claude > :first-child { margin-top: 0; }
  .claude > :last-child { margin-bottom: 0; }
  .user img { display: block; max-width: 100%; max-height: 160px; margin: 0 0 6px; }
  p, ul, ol, pre, blockquote, table { margin: 0 0 14px; }
  ul, ol { padding-left: 22px; list-style: none; }
  /* markers are spans (see markers()): Servo numbers every <ol> item 0 */
  li { position: relative; margin-bottom: 6px; }
  li > p, li > ul, li > ol { margin: 6px 0 0; }
  li > p:first-of-type { margin-top: 0; }
  li > .marker { position: absolute; right: 100%; margin-right: 8px; white-space: nowrap; color: #88c0d0; }
  .think { opacity: 0.5; font-style: italic; white-space: pre-wrap; }
  h1, h2, h3, h4 { margin: 22px 0 8px; font-size: 1.05em; font-weight: 600; line-height: 1.35; color: #88c0d0; }
  b, strong { font-weight: 600; color: #fff; }
  h1 { font-size: 1.2em; }
  a { color: #88c0d0; }
  code { font-family: "Iosevka Nerd Font Mono", monospace; font-size: 0.9em; background: #2e3440; padding: 2px 5px; }
  pre { background: #2e3440; padding: 12px 14px; overflow-x: auto; line-height: 1.5; }
  pre code { padding: 0; background: none; }
  blockquote { border-left: 3px solid #5e81ac; padding-left: 12px; color: #d8dee9; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid #4c566a; padding: 6px 10px; }
  th { background: #3b4252; font-weight: 600; }
  hr { border: 0; border-top: 1px solid #4c566a; margin: 18px 0; }
  .katex-display { overflow-x: auto; overflow-y: hidden; margin: 12px 0; }
  #input { flex: none; padding: 8px 12px 12px; }
  /* 7px + the line's half-leading (~3px) matches the 10px sides */
  #field { background: #3b4252; padding: 7px 10px; }
  #files { display: flex; flex-wrap: wrap; gap: 6px; padding: 3px 0 6px; }
  #files:empty { display: none; }
  #files img { display: block; max-height: 56px; }
  /* the box grows to its full text and this scrolls it, so reveal() controls the position */
  #scroller { position: relative; max-height: 40vh; overflow-y: auto; }
  textarea { display: block; box-sizing: border-box; width: 100%; resize: none; border: 0; border-radius: 0; outline: 0; overflow: hidden;
    background: transparent; color: #eceff4; font: inherit; padding: 0; min-height: 1.45em; }
  /* same text and wrapping as the box, to measure where its caret is */
  #mirror { position: absolute; top: 0; left: 0; right: 0; visibility: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<div id="log"></div>
<div id="input"><div id="field"><div id="files"></div><div id="scroller"><textarea id="box" rows="1" autofocus></textarea><div id="mirror"></div></div></div></div>
<script src="app.js"></script>
