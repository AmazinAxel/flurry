name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3

      # the shell only: `nix build .#default` would also build Servo (no binary cache)
      - name: Lint
        run: nix develop -c cargo clippy --all-targets -- -D warnings

      - name: Test
        run: nix develop -c cargo test
